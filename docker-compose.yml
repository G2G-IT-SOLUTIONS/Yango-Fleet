services:

  postgres:
    image: postgres:16-alpine
    container_name: yango-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: userist
      POSTGRES_PASSWORD: rist
      POSTGRES_DB: yango_fleet

    volumes:
      - yango_postgres_data:/var/lib/postgresql/data

    networks:
      - yango-network


  backend:
    build:
      context: ./backend

    container_name: yango-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    depends_on:
      - postgres

    expose:
      - "5000"

    networks:
      - yango-network


  frontend:
    build:
      context: ./frontend

    container_name: yango-frontend
    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      - backend

    networks:
      - yango-network


  caddy:
    image: caddy:2-alpine
    container_name: yango-caddy
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - yango_caddy_data:/data
      - yango_caddy_config:/config

    depends_on:
      - frontend
      - backend

    networks:
      - yango-network


volumes:
  yango_postgres_data:
  yango_caddy_data:
  yango_caddy_config:


networks:
  yango-network:
    driver: bridge
